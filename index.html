<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Search</title>
    <script type="module" crossorigin src="/goit-advancedjs-hw-04/index.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-advancedjs-hw-04/assets/vendor-BX8YMJUK.js">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-04/assets/vendor-DumFYO8Z.css">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-04/assets/index-Cvs-HMmQ.css">
  </head>
  <body>
    <main class="container">
      <form class="form">
        <label>
          <input
            type="text"
            name="search-text"
            placeholder="Search images..."
            aria-label="Search images"
            required
          />
        </label>
        <button type="submit">Search</button>
      </form>
      <ul class="gallery" aria-label="Search results" aria-busy="false"></ul>
      <button class="load-more" type="button">Load more</button>
      <div class="loading" role="status">
        <span class="loader" aria-hidden="true"></span>
        <p>Loading images, please wait...</p>
      </div>
    </main>
  </body>
</html>
